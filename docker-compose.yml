services:
  postgres:
    image: postgres:16-alpine
    container_name: bkc_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bkc_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bkc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bkc_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bkc_postgres_data:
    name: bkc_postgres_data
